"int","n":"cash_sales","k":"","c":""},{"t":"int","n":"khqr_sales","k":"","c":""},{"t":"int","n":"refunds","k":"","c":""},{"t":"int","n":"cash_refunds","k":"","c":""},{"t":"int","n":"net","k":"","c":""},{"t":"int","n":"collected","k":"","c":""},{"t":"int","n":"unpaid_orders","k":"","c":""},{"t":"int","n":"unpaid_total","k":"","c":""},{"t":"string","n":"note","k":"","c":""}]},"PRINT_SETTINGS":{"attrs":[{"t":"uuid","n":"branch_id","k":"PK,FK","c":""},{"t":"int","n":"paper_width","k":"","c":"58 or 80"},{"t":"bool","n":"auto_print","k":"","c":""},{"t":"int","n":"copies","k":"","c":""},{"t":"bool","n":"start_preparing_on_print","k":"","c":""},{"t":"TicketLanguage","n":"ticket_language","k":"","c":"km en both"}]},"PAYMENT_CONFIGS":{"attrs":[{"t":"uuid","n":"id","k":"PK","c":""},{"t":"uuid","n":"branch_id","k":"FK,UK","c":""},{"t":"string","n":"provider","k":"","c":"BAKONG_KHQR"},{"t":"PaymentEnvironment","n":"environment","k":"","c":"SANDBOX PRODUCTION"},{"t":"KhqrAccountType","n":"account_type","k":"","c":"INDIVIDUAL MERCHANT"},{"t":"string","n":"bakong_account_id","k":"","c":""},{"t":"string","n":"merchant_id","k":"","c":""},{"t":"string","n":"acquiring_bank","k":"","c":""},{"t":"string","n":"account_name","k":"","c":"max 25"},{"t":"string","n":"merchant_city","k":"","c":"max 15"},{"t":"string","n":"webhook_secret_enc","k":"","c":"encrypted, never returned"},{"t":"string","n":"secret_last4","k":"","c":""},{"t":"bool","n":"healthy","k":"","c":""},{"t":"string","n":"health_message","k":"","c":""},{"t":"timestamptz","n":"last_health_check_at","k":"","c":""},{"t":"timestamptz","n":"last_callback_at","k":"","c":""}]},"AUDIT_LOGS":{"attrs":[{"t":"uuid","n":"id","k":"PK","c":""},{"t":"uuid","n":"shop_id","k":"FK","c":""},{"t":"uuid","n":"branch_id","k":"FK","c":"null = shop-wide"},{"t":"uuid","n":"actor_id","k":"FK","c":""},{"t":"string","n":"actor_name","k":"","c":"snapshot"},{"t":"AuditAction","n":"action","k":"","c":"REFUND PAYMENT_COLLECTED ORDER_CLEARED SHIFT_CLOSED ..."},{"t":"string","n":"target","k":"","c":"A-0042, T5 ..."},{"t":"string","n":"summary","k":"","c":""},{"t":"jsonb","n":"before","k":"","c":""},{"t":"jsonb","n":"after","k":"","c":""},{"t":"string","n":"request_id","k":"","c":""},{"t":"timestamptz","n":"created_at","k":"","c":""}]}},"rels":[{"a":"USERS","l":"||","r":"o{","b":"REFRESH_SESSIONS","label":"signs in"},{"a":"USERS","l":"||","r":"o{","b":"USER_TOKENS","label":"verify / reset / invite"},{"a":"USERS","l":"||","r":"o{","b":"SHOP_MEMBERS","label":"works as"},{"a":"SHOPS","l":"||","r":"o{","b":"SHOP_MEMBERS","label":"employs"},{"a":"SHOP_MEMBERS","l":"||","r":"o{","b":"SHOP_MEMBER_BRANCHES","label":"assigned to"},{"a":"BRANCHES","l":"||","r":"o{","b":"SHOP_MEMBER_BRANCHES","label":"staffed"},{"a":"SHOPS","l":"||","r":"o{","b":"BRANCHES","label":"has"},{"a":"SHOPS","l":"||","r":"o{","b":"CATEGORIES","label":"has"},{"a":"SHOPS","l":"||","r":"o{","b":"PRODUCTS","label":"sells"},{"a":"SHOPS","l":"||","r":"o{","b":"MODIFIER_GROUPS","label":"defines"},{"a":"SHOPS","l":"||","r":"o{","b":"MENU_VERSIONS","label":"publishes"},{"a":"CATEGORIES","l":"||","r":"o{","b":"PRODUCTS","label":"groups"},{"a":"PRODUCTS","l":"||","r":"o{","b":"PRODUCT_VARIANTS","label":"sizes"},{"a":"MODIFIER_GROUPS","l":"||","r":"o{","b":"MODIFIER_OPTIONS","label":"contains"},{"a":"PRODUCTS","l":"||","r":"o{","b":"PRODUCT_MODIFIER_GROUPS","label":"uses"},{"a":"MODIFIER_GROUPS","l":"||","r":"o{","b":"PRODUCT_MODIFIER_GROUPS","label":"used by"},{"a":"BRANCHES","l":"||","r":"o{","b":"BRANCH_PRODUCT_OVERRIDES","label":"overrides"},{"a":"PRODUCTS","l":"||","r":"o{","b":"BRANCH_PRODUCT_OVERRIDES","label":"overridden"},{"a":"BRANCHES","l":"||","r":"o{","b":"DINING_TABLES","label":"has"},{"a":"BRANCHES","l":"||","r":"o{","b":"QR_LINKS","label":"prints"},{"a":"BRANCHES","l":"||","r":"o|","b":"PRINT_SETTINGS","label":"configures"},{"a":"BRANCHES","l":"||","r":"o|","b":"PAYMENT_CONFIGS","label":"KHQR account"},{"a":"BRANCHES","l":"||","r":"o{","b":"ORDERS","label":"receives"},{"a":"DINING_TABLES","l":"|o","r":"o{","b":"ORDERS","label":"placed at"},{"a":"MENU_VERSIONS","l":"||","r":"o{","b":"ORDERS","label":"priced from"},{"a":"ORDERS","l":"||","r":"|{","b":"ORDER_ITEMS","label":"contains"},{"a":"ORDER_ITEMS","l":"||","r":"o{","b":"ORDER_ITEM_OPTIONS","label":"chosen options"},{"a":"ORDERS","l":"||","r":"o{","b":"ORDER_EVENTS","label":"timeline"},{"a":"ORDERS","l":"||","r":"|{","b":"PAYMENTS","label":"payment attempts"},{"a":"PAYMENTS","l":"||","r":"o{","b":"REFUNDS","label":"refunded by"},{"a":"PAYMENTS","l":"|o","r":"o{","b":"PAYMENT_EVENTS","label":"provider callbacks"},{"a":"BRANCHES","l":"||","r":"o{","b":"SHIFT_CLOSES","label":"closes"},{"a":"SHIFT_CLOSES","l":"|o","r":"o{","b":"ORDERS","label":"includes"},{"a":"BRANCHES","l":"||","r":"o{","b":"SERVICE_CALLS","label":"receives"},{"a":"DINING_TABLES","l":"||","r":"o{","b":"SERVICE_CALLS","label":"called from"},{"a":"SHOPS","l":"||","r":"o{","b":"AUDIT_LOGS","label":"records"}]};
const WORDS = { one: 'exactly one', zeroOne: 'zero or one', zeroMany: 'zero or more', oneMany: 'one or more' };
const card = (t) => ({ '||': 'one', '|o': 'zeroOne', 'o|': 'zeroOne', '}o': 'zeroMany', 'o{': 'zeroMany', '}|': 'oneMany', '|{': 'oneMany' }[t] || 'one');
const nice = (n) => n.toLowerCase();
const one = (n) => { const w = nice(n); return /ies$/.test(w) ? w.slice(0, -3) + 'y' : /(ch|sh|x|ss)es$/.test(w) ? w.slice(0, -2) : w.replace(/s$/, ''); };
const many = (k) => k === 'zeroMany' || k === 'oneMany';
const laneOf = {}; DATA.lanes.forEach((l) => l.tables.forEach((t) => (laneOf[t] = l)));
const board = document.getElementById('board'), svg = document.getElementById('edges'), panel = document.getElementById('panel');
let selected = null, showAll = false, zoom = 1;
const hiddenLanes = new Set();

// ---------- markers (crow's foot) ----------
const NS = 'http://www.w3.org/2000/svg';
svg.innerHTML = '<defs>' + Object.entries({
  one: 'M9,0V12M12,0V12',
  zeroOne: 'M12,0V12M7.5,6A2.5,2.5 0 1 1 2.5,6A2.5,2.5 0 1 1 7.5,6',
  zeroMany: 'M8,6L16,0M8,6L16,6M8,6L16,12M7,6A2.5,2.5 0 1 1 2,6A2.5,2.5 0 1 1 7,6',
  oneMany: 'M8,6L16,0M8,6L16,6M8,6L16,12M6,0V12',
}).map(([id, d]) => '<marker id="m-' + id + '" viewBox="0 0 16 12" refX="16" refY="6" markerWidth="16" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="' + d + '" fill="none" stroke="context-stroke" stroke-width="1.3"/></marker>').join('') + '</defs>';

// ---------- cards ----------
const cards = {};
for (const lane of DATA.lanes) {
  const col = document.createElement('section');
  col.className = 'lane'; col.dataset.lane = lane.id; col.style.setProperty('--lane', 'var(--' + lane.id + ')');
  col.innerHTML = '<h2>' + lane.title + '</h2>';
  for (const t of lane.tables) {
    const el = document.createElement('div');
    el.className = 'card'; el.tabIndex = 0; el.dataset.t = t;
    el.setAttribute('role', 'button'); el.setAttribute('aria-label', 'Show relationships of ' + nice(t));
    col.appendChild(el); cards[t] = el;
    el.addEventListener('click', (e) => { e.stopPropagation(); select(selected === t ? null : t); });
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(selected === t ? null : t); } });
    el.addEventListener('mouseenter', () => { if (!selected) focus(t); });
    el.addEventListener('mouseleave', () => { if (!selected) focus(null); });
  }
  board.appendChild(col);
}
function renderCards() {
  for (const [t, el] of Object.entries(cards)) {
    const attrs = DATA.tables[t].attrs;
    const rows = showAll ? attrs : attrs.filter((a) => a.k);
    el.innerHTML = '<div class="name">' + nice(t) + '<small>' + attrs.length + ' cols</small></div><ul>' +
      rows.map((a) => '<li title="' + (a.c || '').replace(/"/g, '&quot;') + '"><b>' + (a.k || '') + '</b>' + a.n + '<span class="t">' + a.t + '</span></li>').join('') + '</ul>';
  }
}

// ---------- edges ----------
const visible = (t) => !hiddenLanes.has(laneOf[t].id);
function box(t) { const el = cards[t]; return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight }; }
function drawEdges() {
  svg.querySelectorAll('path.e, text').forEach((n) => n.remove());
  svg.setAttribute('width', board.scrollWidth); svg.setAttribute('height', board.scrollHeight);
  const ends = {}; // card -> side -> [{rel, end, otherY}]
  const plan = DATA.rels.map((r, i) => {
    if (!visible(r.a) || !visible(r.b)) return null;
    const A = box(r.a), B = box(r.b);
    const ax = A.x + A.w / 2, bx = B.x + B.w / 2;
    const same = Math.abs(ax - bx) < 5;
    const sideA = same ? 'R' : ax < bx ? 'R' : 'L';
    const sideB = same ? 'R' : ax < bx ? 'L' : 'R';
    const p = { i, r, A, B, sideA, sideB, same };
    (ends[r.a + sideA] ||= []).push({ p, which: 'a', other: B.y + B.h / 2 });
    (ends[r.b + sideB] ||= []).push({ p, which: 'b', other: A.y + A.h / 2 });
    return p;
  }).filter(Boolean);
  // spread the line ends that share a card side so they don't overlap
  for (const [key, list] of Object.entries(ends)) {
    const t = key.slice(0, -1), b = box(t);
    list.sort((u, v) => u.other - v.other);
    list.forEach((e, k) => { e.p[e.which + 'y'] = b.y + 14 + ((k + 1) * (b.h - 20)) / (list.length + 1); });
  }
  for (const p of plan) {
    const x1 = p.sideA === 'R' ? p.A.x + p.A.w : p.A.x, x2 = p.sideB === 'R' ? p.B.x + p.B.w : p.B.x;
    const y1 = p.ay, y2 = p.by;
    let d;
    if (p.same) { const cx = Math.max(x1, x2) + 50 + Math.abs(y2 - y1) * 0.12; d = 'M' + x1 + ',' + y1 + ' C' + cx + ',' + y1 + ' ' + cx + ',' + y2 + ' ' + x2 + ',' + y2; }
    else { const dx = Math.max(50, Math.abs(x2 - x1) / 2), s1 = p.sideA === 'R' ? 1 : -1, s2 = p.sideB === 'R' ? 1 : -1;
      d = 'M' + x1 + ',' + y1 + ' C' + (x1 + s1 * dx) + ',' + y1 + ' ' + (x2 + s2 * dx) + ',' + y2 + ' ' + x2 + ',' + y2; }
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', d); path.setAttribute('class', 'e');
    path.dataset.a = p.r.a; path.dataset.b = p.r.b;
    path.setAttribute('marker-start', 'url(#m-' + card(p.r.l) + ')');
    path.setAttribute('marker-end', 'url(#m-' + card(p.r.r) + ')');
    svg.appendChild(path);
    const len = path.getTotalLength(), mid = path.getPointAtLength(len / 2);
    const text = document.createElementNS(NS, 'text');
    text.setAttribute('x', mid.x); text.setAttribute('y', mid.y - 4); text.setAttribute('text-anchor', 'middle');
    text.textContent = p.r.label; text.dataset.a = p.r.a; text.dataset.b = p.r.b;
    svg.appendChild(text);
  }
  focus(selected);
}

// ---------- focus / select ----------
function related(t) { const s = new Set([t]); DATA.rels.forEach((r) => { if (r.a === t) s.add(r.b); if (r.b === t) s.add(r.a); }); return s; }
function focus(t) {
  board.classList.toggle('focus', !!t);
  const rel = t ? related(t) : new Set();
  for (const [name, el] of Object.entries(cards)) { el.classList.toggle('on', rel.has(name)); el.classList.toggle('sel', name === selected); }
  svg.querySelectorAll('path.e, text').forEach((n) => n.classList.toggle('on', !!t && (n.dataset.a === t || n.dataset.b === t)));
}
function select(t) { selected = t; focus(t); renderPanel(); }
function sentence(r, t) {
  const L = card(r.l), R = card(r.r);
  const name = (x, k) => '<a data-go="' + x + '">' + (many(k) ? nice(x) : one(x)) + '</a>';
  if (r.a === t) return 'Each <b>' + one(t) + '</b> has ' + WORDS[R] + ' ' + name(r.b, R) + ' <span class="empty">(' + r.label + ')</span>';
  return 'Each <b>' + one(t) + '</b> belongs to ' + WORDS[L] + ' ' + name(r.a, L) + ' <span class="empty">(' + r.label + ')</span>';
}
function renderPanel() {
  if (!selected) {
    panel.innerHTML = '<h3>How to read this</h3><p class="empty">Click a table to see only its relationships. Click it again, press Esc or click the background to see everything.</p>' +
      '<h4>Line ends</h4><div class="legend">' + Object.entries(WORDS).map(([k, w]) =>
        '<svg viewBox="0 0 58 16"><line x1="0" y1="8" x2="40" y2="8" stroke="var(--fg)" stroke-width="1.3" marker-end="url(#m-' + k + ')"/></svg><span>' + w + '</span>').join('') + '</div>' +
      '<h4>Keys</h4><div class="legend"><b>PK</b><span>primary key (the row id)</span><b>FK</b><span>foreign key (points to another table)</span><b>UK</b><span>unique</span></div>' +
      '<h4>Size</h4><p class="empty">' + Object.keys(DATA.tables).length + ' tables, ' + DATA.rels.length + ' relationships. Money is stored in minor units (USD cents, KHR riel).</p>';
    return;
  }
  const lane = laneOf[selected], attrs = DATA.tables[selected].attrs;
  const mine = DATA.rels.filter((r) => r.a === selected || r.b === selected);
  panel.style.setProperty('--lane', 'var(--' + lane.id + ')');
  panel.innerHTML = '<h3>' + nice(selected) + '</h3><span class="lanebadge">' + lane.title + '</span>' +
    '<h4>Relationships (' + mine.length + ')</h4>' + (mine.length ? '<ol>' + mine.map((r) => '<li>' + sentence(r, selected) + '</li>').join('') + '</ol>' : '<p class="empty">None on this diagram.</p>') +
    '<h4>Columns (' + attrs.length + ')</h4><table>' + attrs.map((a) => '<tr><td class="k">' + (a.k || '') + '</td><td><code>' + a.n + '</code><br><span class="empty">' + a.t + '</span></td><td class="note">' + (a.c || '') + '</td></tr>').join('') + '</table>';
  panel.querySelectorAll('a[data-go]').forEach((a) => a.addEventListener('click', () => {
    const t = a.dataset.go;
    if (hiddenLanes.has(laneOf[t].id)) { hiddenLanes.delete(laneOf[t].id); applyLanes(); }
    select(t); cards[t].scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
  }));
}
document.getElementById('vp').addEventListener('click', () => select(null));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') select(null); });

// ---------- tools ----------
const chips = document.getElementById('chips');
for (const lane of DATA.lanes) {
  const b = document.createElement('button');
  b.className = 'chip'; b.setAttribute('aria-pressed', 'true'); b.innerHTML = '<i style="background:var(--' + lane.id + ')"></i>' + lane.title;
  b.addEventListener('click', () => { hiddenLanes.has(lane.id) ? hiddenLanes.delete(lane.id) : hiddenLanes.add(lane.id); b.setAttribute('aria-pressed', String(!hiddenLanes.has(lane.id))); applyLanes(); });
  chips.appendChild(b);
}
function applyLanes() { board.querySelectorAll('.lane').forEach((l) => (l.hidden = hiddenLanes.has(l.dataset.lane))); drawEdges(); }
document.getElementById('q').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase().replace(/\s+/g, '_');
  board.classList.toggle('searching', !!q);
  let first = null;
  for (const [t, el] of Object.entries(cards)) { const hit = !!q && t.toLowerCase().includes(q); el.classList.toggle('match', hit); if (hit && !first) first = t; }
  if (first) cards[first].scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
});
document.getElementById('all').addEventListener('change', (e) => { showAll = e.target.checked; renderCards(); drawEdges(); });
const setZoom = (z) => { zoom = Math.min(1.6, Math.max(0.35, z)); board.style.zoom = zoom; };
document.getElementById('zoomIn').addEventListener('click', () => setZoom(zoom + 0.1));
document.getElementById('zoomOut').addEventListener('click', () => setZoom(zoom - 0.1));
document.getElementById('zoomFit').addEventListener('click', fit);
function fit() { const vp = document.getElementById('vp'); setZoom(Math.min(1, (vp.clientWidth - 8) / (board.scrollWidth || 1))); }
window.addEventListener('resize', () => drawEdges());

renderCards(); renderPanel();
requestAnimationFrame(() => {
  drawEdges(); fit();
  // #orders (any table name) opens with that table selected
  const fromHash = () => { const t = decodeURIComponent(location.hash.slice(1)).trim().toUpperCase(); if (cards[t]) select(t); };
  fromHash(); window.addEventListener('hashchange', fromHash);
});
</script>
