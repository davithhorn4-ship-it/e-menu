const editor = document.getElementById('editor');
const send = (msg) => editor.contentWindow.postMessage(JSON.stringify(msg), ORIGIN);
window.addEventListener('message', (event) => {
  if (event.origin !== ORIGIN || event.source !== editor.contentWindow) return;
  let msg;
  try { msg = JSON.parse(event.data); } catch { return; }
  if (msg.event === 'init') send({ action: 'load', xml, autosave: 0, title: FILE_NAME });
  if (msg.event === 'save') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([msg.xml], { type: 'application/xml' }));
    a.download = FILE_NAME;
    a.click();
    send({ action: 'status', message: 'Downloaded ' + FILE_NAME, modified: false });
  }
});
